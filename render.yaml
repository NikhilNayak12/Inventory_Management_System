services:
  - type: web
    name: inventory-management-system
    env: docker
    dockerfile: ./Dockerfile
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: CACHE_DRIVER
        value: redis
      - key: REDIS_URL
        fromService:
          name: redis
          property: connectionString

databases:
  - name: postgres
    databaseName: inventory_db
    user: postgres
    plan: free

redis:
  - name: redis
    plan: free
